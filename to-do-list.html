<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="to-do-list.css">
    <title>
    To-Do-List
    </title>
    </head>
  <body>
    <h1>To-Do-List</h1>
    <div class="todo-input-grid">
        <input placeholder="To Do Name" class="js-input name-input">
        <input type="date"
        class="js-duedate-input duedate-input">
        <button onclick="addTodo();" class="add-button">
          Add
        </button>
     </div>
     <div class="js-todolist">
      
     </div>
  <script>
    const todolist=[];
    rendertodolist();
    function rendertodolist(){
        let activities='';
        for(i=0; i<=todolist.length-1; i++){
           const todoObject=todolist[i];
          // const name=todoObject.name;
           //const dueDate=todoObject.dueDate;
           const {name,dueDate}=todoObject;
           const html=`
               <div>${name}</div>
               <div> ${dueDate}</div>
                <button onclick="
                    todolist.splice(${i},1);
                    rendertodolist();
                    " class="delete-button">Delete</button>
                  `;
           activities+=html;
        }
       console.log(activities)
       document.querySelector('.js-todolist')
       .innerHTML=activities;
  }
    function addTodo(){
          const inputElement=document.querySelector('.js-input');
          const name=inputElement.value;
          const dateInputElement=document.querySelector('.js-duedate-input');
          const dueDate=dateInputElement.value;
          todolist.push({name,dueDate}
          ); 
          console.log(todolist);
          inputElement.value='';
          rendertodolist();
    }


  </script>  
  </body>
</html>
